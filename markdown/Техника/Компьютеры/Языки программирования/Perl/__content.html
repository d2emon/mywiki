<body>
<h1>Perl</h1>
<blockquote>
<pre>
#!/usr/bin/perl
print "Hello, World!\n";
</pre>
</blockquote><br/>
<br/>
или так:<br/>
<br/>
<blockquote>
<pre>
perl -le "print 'Hello, World!';"
</pre>
</blockquote><br/>
<br/>
или вообще так:<br/>
<br/>
<blockquote>
<pre>
perl -e 'use feature q/say/; say "Hello, World!"'
</pre>
</blockquote><br/>
</body>
