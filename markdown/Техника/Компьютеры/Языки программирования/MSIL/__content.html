<body>
<h1>MSIL</h1>
<blockquote>
<pre>
.assembly HelloWorld
{
}
 
.method static void Main()
{
    .entrypoint
    ldstr "Hello World!"
    call  void [mscorlib]System.Console::WriteLine(string)
    ret
}
</pre>
</blockquote><br/>
</body>
