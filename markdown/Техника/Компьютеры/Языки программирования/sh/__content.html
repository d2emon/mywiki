<body>
<h1>sh</h1>
<blockquote>
<pre>
echo Hello, world!
</pre>
</blockquote><br/>
<br/>
Или так<br/>
<br/>
<blockquote>
<pre>
cat &lt;&lt;EOF
Hello world!
EOF
</pre>
</blockquote><br/>
<br/>
Индусский вариант<br/>
<br/>
<blockquote>
<pre>
for i in 'H' 'e' 'l' 'l' 'o' ' ' 'w' 'o' 'r' 'l' 'd' '!' '\n'; do
        echo -ne "$i"
done
</pre>
</blockquote><br/>
</body>
