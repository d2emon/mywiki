<!DOCTYPE html>
<html>
<head>
	<meta http-equiv='X-UA-Compatible' content='IE=edge' />
	<meta http-equiv='content-type' content='text/html; charset=utf-8'/>
	<title>Lotus Script</title>

	<style type='text/css'>
		body, div, p, table {
			font-size:10pt;
			font-family:Verdana;
		}

		img{border:none}
		
	</style>
	
</head>

<body>
<h1>Lotus Script</h1>
<br/>
<blockquote>
<pre>
  Messagebox "Hello, World!", MB_OK
</pre>
</blockquote><br/>
<br/>
Или так (не самый заметный вариант):<br/>
<br/>
<blockquote>
<pre>
  PRINT "Hello, World!"
</pre>
</blockquote><br/>
<br/>
Или рядом с LS:<br/>
<br/>
<blockquote>
<pre>
  @Prompt([OK];"";"Hello, World!");
</pre>
</blockquote><br/>
<br/>
Ещё на "собаках" (аналог print'а):<br/>
<br/>
<blockquote>
<pre>
  @StatusBar("Hello, World!")
</pre>
</blockquote><br/>
</body>
</html>
