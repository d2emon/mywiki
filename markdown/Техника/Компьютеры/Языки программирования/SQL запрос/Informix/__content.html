<body>
<h1>Informix</h1>
<blockquote>
<pre>
SELECT FIRST 1 'Hello, World!' FROM systables;
</pre>
</blockquote><br/>
<br/>
Обычно хеллоуворлдщика можно ввести в транс, добавив в какой-нибудь частоиспользуемый header-файл следующие строчки (ахтунг, C-specific!):<br/>
<br/>
<blockquote>
<pre>
#ifndef DEFINE_ME
#error Fatal error! There must be some brain in your head!
#endif
</pre>
</blockquote><br/>
<br/>
</body>
