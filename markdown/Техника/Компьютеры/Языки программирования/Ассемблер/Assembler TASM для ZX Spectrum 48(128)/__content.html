<body>
<h1>Assembler TASM для ZX Spectrum 48/128</h1>
<blockquote>
<pre>
  ORG #C000
Start:
  LD HL,Text
Loop:
  LD A,(HL)
  XOR A
  RET Z
  RST 16
  INC HL
  JR Loop
Text:
  DB 'Hello, world!
  DB 0
</pre>
</blockquote><br/>
