<h1>Assembler i8086, MS-DOS, masm</h1>
<blockquote>
<pre>
.model tiny
.code
org 100h
 
Start:
mov ah, 9
mov dx, offset msg
int 21h
 
mov ax, 4C00H
int 21h
 
msg db 'Hello, world$'
end Start
